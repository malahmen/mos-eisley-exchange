<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Mos Eisley Exchange</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="auth">
  <div class="brand"><img src="/logo.svg" alt="" width="26" height="26"> Mos Eisley Exchange</div>
  <div class="card">
    <form id="login" class="form" novalidate>
      <h1>Sign in</h1>
      <p class="muted small">Private dashboard. Ask an admin for an account.</p>
      <label class="field"><span>Username</span>
        <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label class="field"><span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required></label>
      <div><button class="btn" type="submit">Sign in</button></div>
    </form>
    <form id="totp" class="form" novalidate hidden>
      <h1>Two-factor code</h1>
      <p class="muted small" id="totpWho">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
      <label class="field"><span>Code</span>
        <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" required></label>
      <div class="addrow"><button class="btn" type="submit">Verify</button><button class="btn ghost" type="button" id="cancelTotp">Start over</button></div>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
</main>
<script type="module" src="/auth.js"></script>
</body>
</html>
