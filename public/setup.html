<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setup · Mos Eisley Exchange</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="auth">
  <div class="brand"><img src="/logo.svg" alt="" width="26" height="26"> Mos Eisley Exchange</div>
  <div class="card">
    <h1>First-run setup</h1>
    <p class="muted small">No accounts exist yet. Create the first administrator. This page disappears once it is done.</p>
    <form id="setup" class="form" novalidate>
      <label class="field"><span>Admin username <span class="hint">3–32 characters: a–z, 0–9, . _ -</span></span>
        <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label class="field"><span>Password <span class="hint">at least 10 characters</span></span>
        <input type="password" name="password" autocomplete="new-password" required></label>
      <label class="field"><span>Repeat password</span>
        <input type="password" name="password2" autocomplete="new-password" required></label>
      <div><button class="btn" type="submit">Create admin</button></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>
<script type="module" src="/auth.js"></script>
</body>
</html>
